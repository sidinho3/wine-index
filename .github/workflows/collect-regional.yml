name: Collect regional price bulletins

on:
  schedule:
    - cron: "0 6 * * 2"   # Tuesdays, before the EU index build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils
      - run: python tools/collect_regional.py
      - name: Commit new bulletins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -qm "Add new regional price bulletins"
          git pull -q --rebase && git push
