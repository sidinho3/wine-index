name: EU bulk wine index (weekly)

on:
  schedule:
    - cron: "0 7 * * 2"   # Tuesdays 07:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["eu_index.py", "regional_sources.py", "site/**", "data/raw/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q xlrd
      - name: Fetch EU wine price history
        if: github.event_name != 'push'
        run: python eu_fetch.py
      - name: Build indices
        run: python eu_index.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/eu site/eu-data.js
          git diff --cached --quiet || git commit -m "Weekly EU wine index refresh"
          git pull -q --rebase && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
