name: EU bulk wine prices (weekly)

on:
  schedule:
    - cron: "0 7 * * 2"   # Tuesdays 07:00 UTC (EU publishes early in the week)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python eu_fetch.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/eu
          git diff --cached --quiet || git commit -m "Update EU wine price history"
          git push
