name: Rebuild wine index

on:
  push:
    branches: [main]
    paths: ["inbox/**.xlsx", "wine_index.py", "site/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Turn uploaded price lists into snapshots and rebuild indices
        run: |
          python wine_index.py --inbox
      - name: Commit snapshots and site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A inbox data site/data.js 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Add price list snapshot and rebuild indices"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
