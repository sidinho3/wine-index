<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU Wine Price Index</title>
<link rel="stylesheet" href="style.css?v=navy3">
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 2h10l-.6 6.2a4.4 4.4 0 0 1-8.8 0L7 2Z"/><path d="M12 12.6V21M8 21h8M7.4 6h9.2"/></svg>
    <div><h1>Regional Wine Index</h1><p id="updated"></p></div>
  </div>
  <nav class="tabs" aria-label="Indices"><a href="index.html" aria-current="page">EU bulk index</a><a href="bottles.html">Bottle index</a></nav>
</div></header>

<main>
  <section class="card hero" aria-live="polite">
    <div class="hero-head">
      <div>
        <div class="kind" id="h-kind"></div>
        <h2 id="h-name"></h2>
        <div class="big"><span class="lvl num" id="h-lvl"></span><span class="chg num" id="h-chg"></span></div>
      </div>
      <div class="seg" role="group" aria-label="Time range" id="range">
        <button data-m="12">1Y</button><button data-m="60">5Y</button><button data-m="120">10Y</button><button data-m="0" aria-pressed="true">All</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap" id="chart"></div>
  </section>

  <section class="card">
    <h3>Indices</h3>
    <div class="table-scroll"><table id="indices"></table></div>
  </section>

  <section class="card">
    <div class="toolbar"><h3 style="margin:0" id="c-title">Price series</h3><input type="search" id="q" placeholder="Search area or wine class" aria-label="Search series"></div>
    <div class="table-scroll bottles" id="series"></div>
  </section>

  <footer id="foot"></footer>
</main>

<script src="eu-data.js"></script>
<script>
const D = window.EU_DATA;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = v => v.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const f2 = v => v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const mfmt = m => new Date(m + "-01T00:00:00").toLocaleDateString(undefined, { month: "short", year: "numeric" });
const pct = (a, b) => (a != null && b) ? (a / b - 1) * 100 : null;
const chg = v => v == null ? '<span class="muted">–</span>'
  : `<span class="${v > 0.05 ? "up" : v < -0.05 ? "down" : ""}">${v > 0 ? "+" : ""}${f1(v)}%</span>`;
const KIND = { summary: "Headline index", country: "Country index", region: "Regional index", tier: "Quality tier index", colour: "Colour index", series: "Single price series" };
const SEC = { summary: "Headline", country: "By country and region", region: "By country and region", tier: "By quality tier", colour: "By colour" };
const TIER_SHORT = { "PDO": "Protected origin", "PGI": "IGP", "No GI": "No GI" };

let state = { g: "all", months: 0, q: "" };
try { Object.assign(state, JSON.parse(localStorage.getItem("eu-index") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("eu-index", JSON.stringify({ g: state.g, months: state.months })); } catch (e) {} };

const group = id => D.groups.find(g => g.id === id);
const lastMonth = g => D.months[g.start + g.index.length - 1];
const back = (g, k) => { const i = g.index.length - 1 - k; return i >= 0 ? g.index[i] : null; };

if (!D) {
  document.querySelector("main").innerHTML = '<p class="empty">No data yet.</p>';
} else {
  if (!group(state.g)) state.g = "all";
  $("updated").textContent = `EU bulk wine prices · ${mfmt(D.months[0])} to ${mfmt(D.months.at(-1))}`;
  $("range").querySelectorAll("button").forEach(b => b.onclick = () => { state.months = +b.dataset.m; save(); render(); });
  $("q").oninput = e => { state.q = e.target.value.toLowerCase(); renderSeries(); };
  $("foot").innerHTML = `Sources: <a href="${D.sourceUrl}" style="color:inherit">European Commission Agri-food Data Portal</a> (France, Germany, Italy, Spain);
    FranceAgriMer (France, more recent months); Camera di Commercio Alessandria-Asti weekly wine quotations (Piedmont, from 2005);
    Camera di Commercio di Firenze weekly wholesale price list (Tuscany). All are producer (bulk) prices, converted to euros per hectolitre and taken monthly.
    Each composite index is the equal-weighted geometric mean of its series, smoothed with a 3-month median to remove one-off spikes; a series joining later is scaled to the index level of that month, so it doesn't cause a jump.
    Every index starts at 100 in its first month; the cross-country indices start in Aug 2009, and Italy before 2017 reflects Piedmont only. Data last fetched ${esc(D.fetched || "")}.`;
  addEventListener("resize", () => renderChart());
  render();
}

function render() {
  $("range").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.m === state.months));
  const g = group(state.g);
  $("h-kind").textContent = KIND[g.kind];
  $("h-name").textContent = g.kind === "series" ? seriesLabel(g.id.slice(2)) : g.kind === "region" ? `${g.name}, ${g.country}` : g.name;
  $("h-lvl").textContent = f2(g.index.at(-1));
  const lm = lastMonth(g);
  const stale = lm < D.months.at(-1) ? `<span class="stale">data to ${mfmt(lm)}</span>` : `<span class="stale">${mfmt(lm)}</span>`;
  $("h-chg").innerHTML = `<b>${chg(pct(g.index.at(-1), back(g, 12)))}</b> 1 yr · <b>${chg(pct(g.index.at(-1), back(g, 60)))}</b> 5 yr · ${g.members.length} series ${stale}`;
  renderChart(); renderIndexTable(); renderSeries();
}

function seriesLabel(id) {
  const s = D.series.find(x => x.id === id); if (!s) return id;
  return `${s.country}: ${s.wine}`;
}

function renderChart() {
  const el = $("chart"), g = group(state.g), all = group("all");
  const gStart = g.start, gEnd = g.start + g.index.length - 1;
  let from = state.months ? Math.max(gStart, gEnd - state.months) : gStart;
  const xs = []; for (let m = from; m <= gEnd; m++) xs.push(m);
  const main = xs.map(m => g.index[m - gStart]);
  const ref = g.id === "all" ? null : xs.map(m => {
    const i = m - all.start; return i >= 0 && i < all.index.length ? all.index[i] : null; });
  // rebase both lines to 100 at the start of the visible window so they compare cleanly
  const rb = (arr) => { const b = arr.find(v => v != null); return arr.map(v => v == null ? null : v / b * 100); };
  const mainR = state.months ? rb(main) : main, refR = ref ? (state.months ? rb(ref) : rb(ref).map((v, i) => v == null ? null : v * main[0] / 100)) : null;
  $("legend").innerHTML = (ref ? `<span><i></i>${esc(g.kind === "series" ? "This series" : g.name)}</span><span><i class="ref"></i>All EU bulk wine</span>` : "") +
    (state.months ? `<span class="muted">Rebased to 100 at ${mfmt(D.months[from])}</span>` : "");
  if (xs.length < 2) { el.innerHTML = '<p class="empty">Not enough data in this range.</p>'; return; }
  const W = el.clientWidth || 900, H = Math.max(230, Math.min(360, W * 0.4)), narrow = W < 560;
  const m = { t: 10, r: 14, b: 26, l: 44 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = mainR.concat(refR || []).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const ticks = nice(lo, hi, 5); lo = ticks[0]; hi = ticks.at(-1);
  const x = i => m.l + i / (xs.length - 1) * iw, y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  const path = a => { let d = "", pen = false; a.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; }); return d; };
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.name)} index over time"><g class="axis">`;
  for (const t of ticks) s += `<line class="gl" x1="${m.l}" x2="${m.l + iw}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  const span = xs.length, years = span > 30;
  const want = narrow ? 4 : 8;
  if (years) {
    const ys = xs.map((mm, i) => [i, D.months[mm]]).filter(([, mo]) => mo.endsWith("-01"));
    const st = Math.max(1, Math.ceil(ys.length / want));
    ys.filter((_, k) => k % st === 0).forEach(([i, mo]) => s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${mo.slice(0, 4)}</text>`);
  } else {
    const st = Math.max(1, Math.ceil(span / want));
    xs.forEach((mm, i) => { if (i % st === 0) s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i ? "middle" : "start"}">${mfmt(D.months[mm])}</text>`; });
  }
  s += `</g>`;
  if (lo < 100 && hi > 100) s += `<line class="base" x1="${m.l}" x2="${m.l + iw}" y1="${y(100)}" y2="${y(100)}"/>`;
  if (refR) s += `<path d="${path(refR)}" fill="none" stroke="var(--ref)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s += `<path d="${path(mainR)}" fill="none" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<line id="cx" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-3)" stroke-dasharray="3 3" style="display:none"/><g id="cd"></g>`;
  s += `<rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" id="tip"></div>`;
  el.innerHTML = s;
  const svg = el.querySelector("svg"), tip = $("tip"), cx = $("cx"), cd = $("cd");
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(xs.length - 1, Math.round((px - m.l) / iw * (xs.length - 1))));
    cx.setAttribute("x1", x(i)); cx.setAttribute("x2", x(i)); cx.style.display = "";
    cd.innerHTML = (mainR[i] != null ? `<circle cx="${x(i)}" cy="${y(mainR[i])}" r="4.5" fill="var(--line)" stroke="var(--surface)" stroke-width="2"/>` : "") +
      (refR && refR[i] != null ? `<circle cx="${x(i)}" cy="${y(refR[i])}" r="4" fill="var(--ref)" stroke="var(--surface)" stroke-width="2"/>` : "");
    tip.innerHTML = `<b>${mfmt(D.months[xs[i]])}</b><div><span>${esc(g.kind === "series" ? "This series" : g.name)}</span><span class="num">${mainR[i] != null ? f2(mainR[i]) : "–"}</span></div>` +
      (refR ? `<div><span>All EU bulk wine</span><span class="num">${refR[i] != null ? f2(refR[i]) : "–"}</span></div>` : "");
    tip.style.display = "block";
    const sx = x(i) * r.width / W, tw = tip.offsetWidth;
    tip.style.left = (sx + 14 + tw > r.width ? sx - tw - 14 : sx + 14) + "px"; tip.style.top = "8px";
  };
  const hit = $("hit");
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { cx.style.display = "none"; cd.innerHTML = ""; tip.style.display = "none"; });
}

function nice(lo, hi, n) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const st = [1, 2, 2.5, 5, 10].map(k => k * mag).find(v => v >= raw);
  const out = []; for (let v = Math.floor(lo / st) * st; v <= hi + st * 0.999; v += st) out.push(+v.toFixed(4));
  return out;
}

function spark(arr) {
  const a = arr.slice(-60).filter(v => v != null); if (a.length < 2) return "";
  const lo = Math.min(...a), hi = Math.max(...a), w = 80, h = 22;
  const d = a.map((v, i) => (i ? "L" : "M") + (i / (a.length - 1) * w).toFixed(1) + " " + (hi === lo ? h / 2 : h - 2 - (v - lo) / (hi - lo) * (h - 4)).toFixed(1)).join("");
  return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true"><path d="${d}"/></svg>`;
}

function select(id) { state.g = id; save(); render(); scrollTo({ top: 0, behavior: "smooth" }); }
function bindRows(root) {
  root.querySelectorAll("tr.idx").forEach(tr => {
    tr.onclick = () => select(tr.dataset.g);
    tr.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(tr.dataset.g); } };
  });
}

function renderIndexTable() {
  let h = `<thead><tr><th>Index</th><th>Level</th><th>1M</th><th>1Y</th><th>5Y</th><th>10Y</th><th>Since start</th><th>Series</th><th>Data to</th><th>Last 5 yrs</th></tr></thead><tbody>`;
  let last = null;
  for (const g of D.groups.filter(g => g.kind !== "series")) {
    const sec = SEC[g.kind];
    if (sec !== last) { h += `<tr class="sec"><td colspan="10">${sec}</td></tr>`; last = sec; }
    const v = g.index.at(-1);
    h += `<tr class="idx${g.id === state.g ? " sel" : ""}" data-g="${esc(g.id)}" tabindex="0">
      <td${g.kind === "region" ? ' class="reg"' : ""}><span class="nm">${esc(g.name)}</span> <span class="muted from" style="font-size:12px">from ${D.months[g.start].slice(0, 4)}</span></td>
      <td class="num">${f2(v)}</td><td class="num">${chg(pct(v, back(g, 1)))}</td><td class="num">${chg(pct(v, back(g, 12)))}</td>
      <td class="num">${chg(pct(v, back(g, 60)))}</td><td class="num">${chg(pct(v, back(g, 120)))}</td><td class="num">${chg(pct(v, 100))}</td>
      <td class="num">${g.members.length}</td><td class="num">${mfmt(lastMonth(g))}</td><td>${spark(g.index)}</td></tr>`;
  }
  $("indices").innerHTML = h + "</tbody>";
  bindRows($("indices"));
}

function renderSeries() {
  const g = group(state.g);
  let list = D.series.filter(s => g.kind === "series" ? true : g.members.includes(s.id));
  if (g.kind === "series") list = D.series;
  if (state.q) list = list.filter(s => (s.country + " " + s.wine + " " + (s.tier || "")).toLowerCase().includes(state.q));
  $("c-title").textContent = g.kind === "series" ? `All price series (${list.length})` : `Series in ${g.name} (${list.length})`;
  const rows = list.map(s => {
    const ms = Object.keys(s.prices), lastP = s.prices[ms.at(-1)];
    const yr = (() => { const t = ms.at(-1); const y = (+t.slice(0, 4) - 1) + t.slice(4); const k = ms.filter(m => m <= y).at(-1); return k ? s.prices[k] : null; })();
    return { s, lastP, c: pct(lastP, yr) };
  }).sort((a, b) => a.s.country.localeCompare(b.s.country) || a.s.wine.localeCompare(b.s.wine));
  $("series").innerHTML = `<table><thead><tr><th>Series</th><th>Tier</th><th>Latest €/hl</th><th>1Y</th><th>Coverage</th><th>Trend</th></tr></thead><tbody>` +
    rows.map(({ s, lastP, c }) => {
      const gid = "s:" + s.id;
      return `<tr class="idx${gid === state.g ? " sel" : ""}" data-g="${esc(gid)}" tabindex="0"><td class="wine">${esc(s.wine)}<small>${esc(s.country)}</small></td>
      <td>${esc(TIER_SHORT[s.tier] || "–")}</td><td class="num">${f2(lastP)}</td><td class="num">${chg(c)}</td>
      <td class="num muted">${s.first.slice(0, 4)}–${s.last.slice(0, 4)}</td><td>${spark(Object.values(s.prices))}</td></tr>`;
    }).join("") + "</tbody></table>";
  bindRows($("series"));
}
</script>
</body>
</html>
